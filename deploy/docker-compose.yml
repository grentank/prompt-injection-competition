services:
  master:
    build:
      context: ..
      dockerfile: docker/master.Dockerfile
    container_name: pic-master
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - master_data:/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_PATH=/data/master.sqlite
      - SANDBOX_IMAGE=pic-sandbox:latest
      - SANDBOX_NETWORK=pic-network
    networks:
      - pic-network

  caddy:
    image: caddy:2-alpine
    container_name: pic-caddy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - pic-network
    depends_on:
      - master

networks:
  pic-network:
    name: pic-network
    driver: bridge

volumes:
  master_data:
